<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="半日闲：用科学拆解当代人各种好玩行为与好吃东西的爽点机制，每条配一个可点击的互动小实验。" />
  <title>半日闲 · 慢生活研究所</title>
  <meta property="og:title" content="半日闲 · 慢生活研究所" />
  <meta property="og:description" content="用科学拆解好玩与好吃背后的爽点机制，每天抽一个今日盲盒，看哪个项目在几点最爽。每条配一个点击即玩的互动小实验。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="preview.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0B0D14" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="preview.png" />
</head>
<body>
  <!-- 背景霓虹光斑 -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <div class="grid-overlay"></div>
  </div>

  <!-- 顶部导航 -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">闲</span>
        <div class="brand-text">
          <strong>半日闲</strong>
          <small>慢生活研究所 · 零依赖纯静态</small>
        </div>
      </div>
      <nav class="topnav" id="topnav" aria-label="站内导航">
        <button class="nav-btn is-active" type="button" data-goto="entries">闲趣条目</button>
        <button class="nav-btn" type="button" data-goto="lucky">今日盲盒</button>
        <button class="nav-btn" type="button" data-goto="persona">摸鱼人格</button>
        <button class="nav-btn" type="button" data-goto="times">时段爽感<span class="nav-count" id="nav-times-count"></span></button>
      </nav>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"/></svg>
        <input id="search" type="search" placeholder="搜索行为 / 食物 / 机制标签…" autocomplete="off" />
        <button id="search-clear" class="search-clear" type="button" aria-label="清除搜索" hidden>×</button>
      </div>
      <a class="star-btn" id="star-btn" href="https://github.com/wanfeng-vesper/lying-flat-handbook" target="_blank" rel="noopener" title="顺手赏一颗 Star，作者就能安心闲更久 ✨">⭐ 赏颗星，闲更香</a>
    </div>
  </header>

  <main>
    <!-- 首屏轮播：自动播放，循环介绍不同的玩法 -->
    <section class="hero-carousel" id="hero-carousel" aria-label="精彩玩法轮播" aria-roledescription="carousel"></section>

    <!-- 今日盲盒 + 摸鱼人格：合并卡片，圆形切换 -->
    <section class="duo" id="duo">
      <div class="duo-head">
        <div class="duo-switch" role="tablist" aria-label="今日盲盒与摸鱼人格切换">
          <button class="duo-btn is-active" type="button" role="tab" aria-selected="true" data-duo="lucky">
            <span class="duo-ico">🎁</span><span class="duo-txt">今日盲盒</span>
          </button>
          <button class="duo-btn" type="button" role="tab" aria-selected="false" data-duo="persona">
            <span class="duo-ico">🧭</span><span class="duo-txt">摸鱼人格</span>
          </button>
        </div>

        <div class="jobs-clock" id="times-clock" role="button" tabindex="0" title="点击跳回此刻最爽的项目">
          <span class="clock-label">此刻 <b id="clock-now">--:--</b> 最爽的是</span>
          <span class="clock-job" id="clock-job">—</span>
          <span class="clock-desc" id="clock-desc"></span>
          <span class="clock-go">想现在就玩？点开看看此刻最爽的项目 →</span>
        </div>
      </div>

      <div class="duo-panels">
        <div class="duo-panel is-active" id="lucky" data-panel="lucky">
          <div class="lucky-head">
            <span class="lucky-kicker">🎁 今日盲盒</span>
            <h2 class="lucky-title">今天，<span class="glow-pink">抽一个</span>闲趣方式</h2>
            <p class="lucky-sub" id="lucky-sub">每天自动换一个。不喜欢？点「换一个」再抽。</p>
          </div>
          <div class="lucky-box" id="lucky-box" aria-live="polite"></div>
        </div>
        <div class="duo-panel" id="persona" data-panel="persona">
          <div class="persona-box" id="persona-box"></div>
        </div>
      </div>
    </section>

    <!-- 控制区 -->
    <section class="controls" id="entries">
      <div class="controls-left">
        <div class="cat-switch" id="cat-switch" role="tablist" aria-label="分类切换">
          <button class="cat-btn is-active" data-cat="all" role="tab">🌈 全部</button>
          <button class="cat-btn" data-cat="fun" role="tab">🎮 好玩</button>
          <button class="cat-btn" data-cat="food" role="tab">🍜 好吃</button>
        </div>
        <div class="cat-switch aud-switch" id="aud-switch" role="tablist" aria-label="我是谁">
          <button class="cat-btn is-active" data-aud="all" role="tab">🤷 随便逛逛</button>
          <button class="cat-btn" data-aud="busy" role="tab">🧃 忙里偷闲党</button>
          <button class="cat-btn" data-aud="bored" role="tab">🪴 闲得发慌党</button>
        </div>
      </div>
      <div class="result-count" id="result-count"></div>
      <button class="cat-btn mylist-btn" id="mylist-btn" type="button" title="只看我加入待玩清单的玩法">📌 我的清单 <b id="mylist-count">0</b></button>
      <div class="active-filters" id="active-filters" aria-live="polite"></div>
    </section>

    <!-- 卡片网格 -->
    <section class="cards" id="cards" aria-live="polite"></section>

    <!-- 空状态 -->
    <div class="empty" id="empty" hidden>
      <div class="empty-emoji">🪦</div>
      <p>没有找到匹配的闲趣方式，换个关键词试试？</p>
    </div>

    <!-- 时段爽感：哪个项目在几点最爽 -->
    <section class="times" id="times">
      <div class="times-head">
        <div class="times-intro">
          <span class="times-kicker">⏰ 时段模块</span>
          <h2 class="times-title">哪个项目，在<span class="glow-cyan">几点</span>最爽？</h2>
          <p class="times-sub">每个项目都有它最对味的时间段。点一个时段档，看看此刻最适合玩什么；或看「此刻最爽」给你挑好的几个，点开就能玩。</p>
        </div>
      </div>

      <div class="times-toolbar">
        <div class="times-slots" id="times-slots"></div>
        <button class="times-now" id="times-now" type="button">回到此刻</button>
      </div>

      <div class="times-grid" id="times-grid" aria-live="polite"></div>
    </section>

  </main>

  <button class="to-top" id="to-top" type="button" aria-label="回到顶部"><span class="rocket">🚀</span></button>

  <footer class="site-footer">
    <p>本指南仅供轻松科普，所有「机制」均为通俗化解读，不构成医学或健康建议。 · 双击 <code>index.html</code> 即可离线浏览。</p>
  </footer>

  <!-- 详情弹层 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" data-close aria-label="关闭">×</button>
      <button class="modal-share" id="modal-share" type="button" title="生成分享海报">📤 分享海报</button>
      <div class="modal-head">
        <div class="modal-emoji" id="modal-emoji"></div>
        <div>
          <span class="modal-cat" id="modal-cat"></span>
          <span class="modal-genre" id="modal-genre"></span>
          <h2 id="modal-title"></h2>
          <p class="modal-hook" id="modal-hook"></p>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-explain" id="modal-explain"></div>
        <div class="modal-benefit" id="modal-benefit" hidden></div>
        <div class="modal-dopamine" id="modal-dopamine"></div>
        <div class="modal-tags" id="modal-tags"></div>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="lab">
          <div class="lab-label">🧪 点击运行互动实验<button class="lab-sound" id="lab-sound" type="button" title="开关音效" aria-label="开关音效">🔊</button></div>
          <div class="lab-stage" id="lab-stage"></div>
          <div class="lab-caption" id="lab-caption"></div>
        </div>
        <div class="how" id="modal-how" hidden></div>
      </div>
    </div>
  </div>

  <!-- 顺序加载：数据 → 实验 → 应用 -->
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/labs.js"></script>
  <script defer src="assets/js/persona.js"></script>
  <script defer src="assets/js/like.js"></script>
  <script defer src="assets/js/carousel.js"></script>
  <script defer src="assets/js/poster.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="assets/js/duo.js"></script>
</body>
</html>
